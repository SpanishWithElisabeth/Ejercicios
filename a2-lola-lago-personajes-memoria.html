<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lola Lago — Personajes</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f4f8fd;
    color: #222;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  header {
    max-width: 820px;
    margin: 0 auto 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  h1 { font-size: 1.5rem; color: #5e9ed7; }
  .badge {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    background: #f5ca64;
    color: #1a1a1a;
    border-radius: 20px;
    padding: 4px 10px;
  }
  .instructions {
    max-width: 820px;
    margin: 0 auto 16px;
    font-size: 0.95rem;
    color: #555;
    line-height: 1.45;
  }
  .score-bar {
    max-width: 820px;
    margin: 0 auto 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 14px;
    background: #fff;
    border: 1px solid #d0e4f5;
    border-radius: 10px;
    font-size: 0.88rem;
    color: #555;
    flex-wrap: wrap;
  }
  .score-bar strong { color: #5e9ed7; }

  .btn {
    background: #5e9ed7;
    color: #fff;
    border: none;
    padding: 9px 18px;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn:hover:not(:disabled) { background: #89c2f1; }

  .word-bank {
    max-width: 820px;
    margin: 0 auto 22px;
    background: #fff;
    border: 1px solid #d0e4f5;
    border-radius: 12px;
    padding: 14px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    min-height: 60px;
    position: sticky;
    top: 8px;
    z-index: 10;
    box-shadow: 0 2px 12px rgba(0,0,0,0.04);
  }
  .chip {
    background: #e8f3fd;
    border: 2px solid #d0e4f5;
    color: #222;
    padding: 10px 16px;
    border-radius: 22px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    user-select: none;
    min-height: 44px;
  }
  .chip:hover { border-color: #89c2f1; background: #d8ebfa; }
  .chip.selected {
    background: #5e9ed7;
    color: #fff;
    border-color: #5271ff;
    box-shadow: 0 0 0 3px rgba(82, 113, 255, 0.25);
  }

  .grid {
    max-width: 820px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .card {
    background: #fff;
    border: 1px solid #d0e4f5;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .desc {
    flex: 1;
    font-size: 0.95rem;
    line-height: 1.45;
    color: #333;
  }
  .slot {
    flex: 0 0 168px;
    border: 2px dashed #d0e4f5;
    border-radius: 10px;
    padding: 12px 8px;
    text-align: center;
    min-height: 52px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    color: #aaa;
    transition: all 0.15s;
  }
  .slot:hover { border-color: #89c2f1; background: #f4f8fd; }
  .slot.filled {
    background: #e8f3fd;
    border-style: solid;
    border-color: #5e9ed7;
    color: #222;
    font-weight: 600;
  }
  .slot.correct {
    background: #e8f3fd;
    border-color: #5e9ed7;
    color: #2c6ea4;
    border-style: solid;
    font-weight: 600;
  }
  .slot.wrong {
    background: #fdf0eb;
    border-color: #d77a5e;
    color: #a64b30;
    border-style: solid;
    font-weight: 600;
  }

  .actions {
    max-width: 820px;
    margin: 24px auto 0;
    display: flex;
    justify-content: center;
    gap: 10px;
  }
  .feedback {
    max-width: 820px;
    margin: 18px auto 0;
    padding: 14px 18px;
    border-radius: 12px;
    text-align: center;
    font-size: 1rem;
    font-weight: 600;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.success { background: #e8f3fd; color: #2c6ea4; border: 1px solid #5e9ed7; }
  .feedback.partial { background: #fff7e0; color: #8a6d1c; border: 1px solid #f5ca64; }

  @media (max-width: 600px) {
    body { padding: 16px 12px 32px; }
    h1 { font-size: 1.3rem; }
    .card { flex-direction: column; align-items: stretch; }
    .slot { flex: none; min-height: 56px; font-size: 1rem; }
    .chip { padding: 12px 18px; font-size: 1rem; }
    .btn { padding: 12px 20px; font-size: 0.95rem; min-height: 44px; }
    .word-bank { top: 0; border-radius: 0 0 12px 12px; }
    .actions { flex-direction: column; }
    .actions .btn { width: 100%; }
  }
</style>
</head>
<body>

<header>
  <h1>Lola Lago — Personajes</h1>
  <span class="badge">A2</span>
</header>

<p class="instructions">
  Lee cada descripción y elige el personaje correcto. Haz clic en un nombre y luego en la caja de la descripción que le corresponde. Haz clic en un nombre ya colocado para devolverlo al banco.
</p>

<div class="score-bar">
  <span>Colocados <strong id="placed-count">0</strong> / <strong id="total-count">10</strong></span>
  <span>Elige un nombre, luego una caja</span>
</div>

<div class="word-bank" id="bank"></div>

<div class="grid" id="grid"></div>

<div class="feedback" id="feedback"></div>

<div class="actions">
  <button class="btn" id="check">Verificar</button>
  <button class="btn" id="reset" style="background:transparent;color:#5e9ed7;border:1px solid #d0e4f5;">Empezar de nuevo</button>
</div>

<script>
  const characters = [
    { name: "Lola Lago", desc: "Detective privada, jefa de la agencia y la que narra el diario. Es práctica, irónica y buena en lo suyo, aunque vive a dieta y anda enamorada de Cayetano." },
    { name: "Cayetano Gaos", desc: "El cliente de Lola, dueño de la galería Acanto. Muy atractivo, vive solo, y la contrata para probar que el pintor Urpiano no existe." },
    { name: "Urpiano", desc: "El supuesto pintor surrealista alrededor del cual gira el misterio. Nadie lo conocía antes de 1980 y ahora sus cuadros valen una fortuna. La gran duda es si de verdad existió." },
    { name: "Margarita", desc: "La secretaria de Lola. Trabaja poco, lee revistas del corazón y se pasa el día hablando por teléfono con su novio, pero Lola le tiene cariño." },
    { name: "Tony", desc: "El novio de Margarita, presente solo a través de las llamadas telefónicas." },
    { name: "Feliciano", desc: "El chico de los mandados, joven y feo pero encantador. Le gusta comer y está enamorado en secreto de Margarita, a quien le escribe poemas." },
    { name: "Miguel", desc: "Uno de los socios de Lola. Puntual, culto y muy tímido con las mujeres." },
    { name: "Paco", desc: "El otro socio. Un gordito simpático, mujeriego y algo machista, siempre con problemas de plata y una novia nueva cada tanto." },
    { name: "Javier Mézquiriz", desc: "Pintor famoso y amigo de Lola, fanático de los juegos de palabras. Es quien le da información sobre Urpiano y el mundo del arte." },
    { name: "Alonso de la Prada", desc: "Un antiguo amor pasajero de Lola. No aparece en la historia, pero fue él quien le habló de ella a Cayetano." }
  ];

  function shuffle(a) {
    const copy = a.slice();
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  const TOTAL = characters.length;
  document.getElementById('total-count').textContent = TOTAL;

  let selected = null;
  let bankNames = shuffle(characters.map(c => c.name));
  let displayOrder = shuffle(characters.map((c, i) => i)); // order of description cards
  let slots = new Array(TOTAL).fill(null); // slots[displayPos] = name placed

  const bankEl = document.getElementById('bank');
  const gridEl = document.getElementById('grid');
  const feedbackEl = document.getElementById('feedback');
  const placedCountEl = document.getElementById('placed-count');

  function renderBank() {
    bankEl.innerHTML = '';
    if (bankNames.length === 0) {
      bankEl.innerHTML = '<span style="color:#aaa;font-size:0.88rem;">Todos los nombres colocados</span>';
      return;
    }
    bankNames.forEach(n => {
      const c = document.createElement('button');
      c.className = 'chip';
      c.textContent = n;
      if (selected === n) c.classList.add('selected');
      c.addEventListener('click', () => {
        selected = (selected === n) ? null : n;
        renderBank();
      });
      bankEl.appendChild(c);
    });
  }

  function renderGrid() {
    gridEl.innerHTML = '';
    displayOrder.forEach((charIndex, pos) => {
      const card = document.createElement('div');
      card.className = 'card';

      const d = document.createElement('div');
      d.className = 'desc';
      d.textContent = characters[charIndex].desc;
      card.appendChild(d);

      const s = document.createElement('div');
      s.className = 'slot';
      const value = slots[pos];
      if (value) {
        s.textContent = value;
        s.classList.add('filled');
      } else {
        s.textContent = '¿Quién es?';
      }
      s.addEventListener('click', () => {
        if (value) {
          slots[pos] = null;
          bankNames.push(value);
          selected = null;
          update();
          return;
        }
        if (selected) {
          slots[pos] = selected;
          bankNames = bankNames.filter(n => n !== selected);
          selected = null;
          update();
        }
      });
      card.appendChild(s);
      gridEl.appendChild(card);
    });
  }

  function update() {
    renderBank();
    renderGrid();
    placedCountEl.textContent = slots.filter(Boolean).length;
    feedbackEl.classList.remove('show', 'success', 'partial');
  }

  document.getElementById('check').addEventListener('click', () => {
    if (slots.some(s => s === null)) {
      feedbackEl.textContent = 'Coloca todos los nombres antes de verificar';
      feedbackEl.classList.add('show', 'partial');
      return;
    }
    let correct = 0;
    displayOrder.forEach((charIndex, pos) => {
      const slotEl = gridEl.children[pos].querySelector('.slot');
      slotEl.classList.remove('filled');
      if (slots[pos] === characters[charIndex].name) {
        slotEl.classList.add('correct');
        correct++;
      } else {
        slotEl.classList.add('wrong');
      }
    });
    feedbackEl.textContent = correct === TOTAL
      ? 'Perfecto. ' + correct + ' / ' + TOTAL + ' correctas'
      : correct + ' / ' + TOTAL + ' correctas';
    feedbackEl.classList.add('show', correct === TOTAL ? 'success' : 'partial');
  });

  document.getElementById('reset').addEventListener('click', () => {
    selected = null;
    bankNames = shuffle(characters.map(c => c.name));
    displayOrder = shuffle(characters.map((c, i) => i));
    slots = new Array(TOTAL).fill(null);
    update();
  });

  update();
</script>

</body>
</html>
